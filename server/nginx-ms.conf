# Cert Prep (MS-credential) at https://ms.71177117.xyz
# Static app from /var/www/ms-credential; progress sync API proxied to the
# mscred-sync systemd service on 127.0.0.1:8793 (server/sync_server.py).
# certbot --nginx adds the 443 block and the HTTP->HTTPS redirect from this file.
server {
    listen 80;
    server_name ms.71177117.xyz;

    root /var/www/ms-credential;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The only API the app talks to (assets/sync.js). The sync code travels in the
    # X-Sync-Code header; the body is the whole progress blob, a few tens of KB.
    location = /api/sync {
        proxy_pass http://127.0.0.1:8793/sync;
        include /etc/nginx/proxy_params;
        client_max_body_size 6m;
        proxy_read_timeout 30s;
    }

    # data/bank.js and the guide are several MB of JS; they change only on rebuilds.
    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json;
    gzip_vary on;

    # Deploys replace app.js, bank.js, guide.js and index.html in place (no hashed names), so the
    # browser must check with the server before reusing its copy: "no-cache" revalidates every
    # load, and an unchanged file costs only a 304 (ETag / Last-Modified).
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|webp|gif|svg)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
